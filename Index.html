<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ray 日記</title>
<style>
:root{--bg:#f8f3ff;--card:#fffaff;--ink:#51445f;--muted:#9386a3;--pink:#c783b8;--lav:#e9ddf7;--line:#eadff1}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f5edff,#fff8fb);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:var(--ink)}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:18px 14px 28px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 5px 18px}
.logo{font-size:24px;font-weight:800;letter-spacing:.5px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.pill{border:0;background:#eee4fa;color:#7b5c91;border-radius:999px;padding:9px 13px;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:12px;border:0;border-radius:15px;background:#eee6f7;color:#806a91;font-weight:700}.tabs button.active{background:#b979aa;color:white}
.card{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #d9c8e522}
h2{font-size:16px;margin:0 0 12px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,textarea{width:100%;border:1px solid #e5d8ed;background:#fffdfd;border-radius:13px;padding:12px;font:inherit;color:var(--ink);outline:none}
textarea{min-height:100px;resize:vertical}
.btn{border:0;background:linear-gradient(90deg,#bb79a9,#987cc2);color:white;border-radius:14px;padding:12px 16px;font-weight:700;width:100%;margin-top:10px}
.btn.secondary{background:#eee5f6;color:#765c8b}.btn.small{width:auto;margin:0;padding:8px 12px;font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px}.bubble{padding:12px 14px;border-radius:17px;max-width:88%;line-height:1.55;font-size:14px}.me{align-self:flex-end;background:#eadcf7;border-bottom-right-radius:5px}.ray{align-self:flex-start;background:#fff;border:1px solid #eee1f3;border-bottom-left-radius:5px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.entry{padding:13px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.date{font-size:12px;color:#a17ba4;font-weight:700}.entrytitle{font-weight:700;margin:5px 0}.entrytext{font-size:14px;line-height:1.7;white-space:pre-wrap}
.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
</style></head>
<body><div class="wrap">
<header><div><div class="logo">🌙 Ray 日記</div><div class="sub">把每天的小故事，溫柔收藏起來 ♡</div></div><button class="pill" onclick="showBackup()">💾 備份</button></header>
<div class="tabs"><button id="tabchat" class="active" onclick="switchTab('chat')">💬 聊天</button><button id="tabdiary" onclick="switchTab('diary')">📖 日記</button></div>
<section id="chat">
<div class="card"><h2>今天想跟 Ray 說什麼？</h2><div class="chat" id="chatlog"><div class="bubble ray">嗨～今天過得怎麼樣？不管開心或疲累，都可以慢慢跟我說。🌷</div></div>
<label>你的訊息</label><textarea id="msg" placeholder="例如：今天陪先生回診，回家後煮了晚餐……"></textarea><button class="btn" onclick="sendMsg()">送出聊天</button>
<div class="note" style="margin-top:10px">※ 這是免費省錢版預覽：聊天內容可複製給 ChatGPT，請 Ray 幫你整理日記，再貼到「日記」保存。</div></div>
<div class="card"><h2>✨ 今日小提醒</h2><div class="note">每天聊完，可以請 Ray：「幫我把今天聊天整理成日記」。</div></div>
</section>
<section id="diary" class="hidden">
<div class="card"><h2>📖 收藏今天的故事</h2><label>日記日期</label><input type="date" id="ddate"><label>日記標題</label><input id="dtitle" placeholder="例如：忙碌但溫暖的一天"><label>日記內容</label><textarea id="dcontent" placeholder="把 Ray 整理好的日記貼在這裡……"></textarea><button class="btn" onclick="saveDiary()">♡ 保存日記</button></div>
<div class="card"><h2>🗓️ 日記回顧</h2><div id="entries"><div class="note">還沒有收藏日記，寫下第一篇吧 ♡</div></div></div>
</section>
<section id="backup" class="hidden"><div class="card"><h2>💾 日記備份與還原</h2><p class="note">備份檔可保存日記資料；換手機時可匯入還原。</p><button class="btn" onclick="exportData()">⬇️ 匯出備份檔</button><label>選擇備份檔還原</label><input type="file" id="file" accept=".json,application/json"><button class="btn secondary" onclick="importData()">⬆️ 匯入還原</button><button class="btn secondary" onclick="switchTab('diary')">返回日記</button></div></section>
</div>
<script>
const KEY='rayDiaryEntries_v1';let entries=JSON.parse(localStorage.getItem(KEY)||'[]');
document.getElementById('ddate').value=new Date().toLocaleDateString('en-CA');
function switchTab(t){['chat','diary','backup'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));document.getElementById('tabchat').classList.toggle('active',t==='chat');document.getElementById('tabdiary').classList.toggle('active',t==='diary');if(t==='diary')renderEntries()}
function showBackup(){switchTab('backup')}
function sendMsg(){let v=document.getElementById('msg').value.trim();if(!v)return;let b=document.createElement('div');b.className='bubble me';b.textContent=v;document.getElementById('chatlog').appendChild(b);document.getElementById('msg').value='';let r=document.createElement('div');r.className='bubble ray';r.textContent='我收到這段生活分享啦 ♡ 你可以把聊天內容交給 ChatGPT 的 Ray 整理成日記，再保存到「日記」頁。';document.getElementById('chatlog').appendChild(r);r.scrollIntoView({behavior:'smooth'})}
function saveDiary(){let date=document.getElementById('ddate').value,title=document.getElementById('dtitle').value.trim()||'今天的小故事',content=document.getElementById('dcontent').value.trim();if(!content){alert('先貼上日記內容喔 ♡');return}entries.unshift({date,title,content,id:Date.now()});localStorage.setItem(KEY,JSON.stringify(entries));document.getElementById('dtitle').value='';document.getElementById('dcontent').value='';renderEntries();alert('日記收藏成功！🌷')}
function renderEntries(){let box=document.getElementById('entries');box.innerHTML='';if(!entries.length){box.innerHTML='<div class="note">還沒有收藏日記，寫下第一篇吧 ♡</div>';return}entries.forEach(e=>{let d=document.createElement('div');d.className='entry';d.innerHTML='<div class="date">'+e.date+'</div><div class="entrytitle"></div><div class="entrytext"></div><button class="btn secondary small" style="margin-top:8px" onclick="delDiary('+e.id+')">刪除</button>';d.querySelector('.entrytitle').textContent=e.title;d.querySelector('.entrytext').textContent=e.content;box.appendChild(d)})}
function delDiary(id){if(confirm('確定刪除這篇日記嗎？')){entries=entries.filter(e=>e.id!==id);localStorage.setItem(KEY,JSON.stringify(entries));renderEntries()}}
function exportData(){let blob=new Blob([JSON.stringify({app:'RayDiary',version:1,entries},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ray日記備份_'+new Date().toLocaleDateString('en-CA')+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){let f=document.getElementById('file').files[0];if(!f){alert('請先選擇 JSON 備份檔');return}let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.entries))throw Error();if(!confirm('匯入會覆蓋目前日記，確定嗎？'))return;entries=obj.entries;localStorage.setItem(KEY,JSON.stringify(entries));renderEntries();alert('還原成功！🌷')}catch(e){alert('備份檔格式不正確')}};reader.readAsText(f)}
renderEntries();
</script></body></html>
